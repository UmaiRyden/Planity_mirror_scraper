# nixpacks.toml — Railway build config for Puppeteer (headless Chromium)
# These apt packages provide the shared libraries that Chromium requires on Linux.

[phases.setup]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxext6",
  "libfontconfig1",
]
